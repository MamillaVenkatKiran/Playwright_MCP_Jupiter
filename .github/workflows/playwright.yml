name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jupiter-toys/e2e

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
        cache-dependency-path: jupiter-toys/e2e/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Type-check framework
      run: npx tsc --noEmit

    - name: Run Playwright tests
      run: npm test

    - name: Generate Allure report
      if: ${{ always() }}
      run: npm run allure:report

    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: jupiter-toys/e2e/html-report/
        if-no-files-found: warn
        retention-days: 30

    - name: Upload Allure report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: allure-report
        path: |
          jupiter-toys/e2e/allure-report/
          jupiter-toys/e2e/allure-results/
        if-no-files-found: warn
        retention-days: 30

    - name: Upload failure evidence
      uses: actions/upload-artifact@v4
      if: ${{ failure() && !cancelled() }}
      with:
        name: playwright-failure-evidence
        path: |
          jupiter-toys/e2e/test-results/
          jupiter-toys/e2e/screenshots/
        if-no-files-found: warn
        retention-days: 30
